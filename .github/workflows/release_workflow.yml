name: Release Alpha and Propose Stable

on:
  workflow_dispatch:
  # pull_request_target, not pull_request: a pull request from a fork gets a
  # read-only token and no secrets under pull_request, so merging one directly
  # could not push the version bump nor publish. The called workflow checks
  # out only `branch` and the commits it writes, never the pull request's
  # head, and runs only once the pull request is merged.
  pull_request_target:
    types: [closed]
    branches: [dev]

jobs:
  publish_alpha:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets: inherit
    with:
      branch: 'dev'
      version_file: 'ovos_number_parser/version.py'
      setup_py: 'setup.py'
      update_changelog: true
      publish_prerelease: true
      propose_release: true
      changelog_max_issues: 100
      publish_pypi: true
      notify_matrix: true
